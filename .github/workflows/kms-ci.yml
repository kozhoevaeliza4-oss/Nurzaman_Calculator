name: KMS backend CI

on:
  push:
    paths:
      - "kms/**"
  pull_request:
    paths:
      - "kms/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kms/package-lock.json

      - run: npm ci
      - run: npm run lint:ts
      - run: npm test
      - run: npm run build
