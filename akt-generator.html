<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акты</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Акты">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c2a20">
<link rel="manifest" href="assets/akt-icons/manifest.json">
<link rel="apple-touch-icon" href="assets/akt-icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/akt-icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/akt-icons/icon-32.png">
<style>
  :root{
    --paper:#f2ecdd;
    --paper-deep:#eae1cc;
    --ink:#242019;
    --ink-soft:#6b6152;
    --line:#c9bb98;
    --seal:#7c2a20;
    --seal-dark:#5c1f18;
    --gold:#96702c;
    --ui-font: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    font-family: "Times New Roman", Georgia, serif;
    color:var(--ink);
    margin:0;
    padding:0 0 40px;
    background:#fff;
  }
  .toolbar{
    background:var(--paper);
    border-top:3px solid var(--ink);
    border-bottom:1px solid var(--line);
    padding:20px 18px 24px;
    margin-bottom:26px;
    font-family: var(--ui-font);
  }
  .toolbar .section{
    padding:16px 0 6px;
    border-top:1px solid var(--line);
  }
  .toolbar .section:first-of-type{
    border-top:none;
    padding-top:2px;
  }
  .toolbar h2{
    margin:0 0 14px 0;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .toolbar h2 .num{
    color:var(--seal);
    font-family: Georgia, serif;
    font-style:italic;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:10px;
  }
  .field{
    flex:1 1 200px;
    display:flex;
    flex-direction:column;
    font-size:12px;
    color:var(--ink-soft);
  }
  .field input, .field select{
    font-family: var(--ui-font);
    font-size:14px;
    padding:8px 9px;
    border:none;
    border-bottom:1.5px solid var(--line);
    border-radius:0;
    margin-top:4px;
    background:transparent;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-bottom-color:var(--seal);
  }
  table.items{
    width:100%;
    border-collapse:collapse;
    font-family: var(--ui-font);
    font-size:13px;
    margin-top:10px;
    background:#fff;
  }
  table.items th, table.items td{
    border:1px solid var(--line);
    padding:6px;
  }
  table.items th{
    background:var(--paper-deep);
    font-weight:600;
    color:var(--ink-soft);
    text-align:left;
  }
  table.items input{
    width:100%;
    border:none;
    background:transparent;
    font-family: var(--ui-font);
    font-size:13px;
    padding:2px;
    color:var(--ink);
  }
  .row-actions{
    text-align:center;
  }
  .btn{
    font-family: var(--ui-font);
    font-size:13px;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid var(--seal);
    background:var(--seal);
    color:#fdf9ef;
    cursor:pointer;
  }
  .btn:hover{ background:var(--seal-dark); border-color:var(--seal-dark); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
  }
  .btn.secondary:hover{ background:var(--ink); color:#fdf9ef; }
  .btn.small{
    padding:4px 9px;
    font-size:12px;
  }
  .btn.danger{
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
  }
  .btn.danger:hover{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .chip{
    font-family: var(--ui-font);
    font-size:12px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:2px;
    padding:5px 8px 5px 10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--seal); color:var(--ink);}
  .chip .x{
    color:var(--seal);
    font-weight:bold;
    padding:0 3px;
  }
  .save-hint{
    font-family: var(--ui-font);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ===== ПЕЧАТНЫЙ ДОКУМЕНТ ===== */
  .doc{
    max-width:900px;
    margin:0 auto;
    border:1px solid #000;
    padding:18px 22px;
  }
  .doc-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:10px;
  }
  .doc-meta{
    font-size:14px;
    margin-bottom:4px;
  }
  table.doc-table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
    font-size:14px;
  }
  table.doc-table th, table.doc-table td{
    border:1px solid #000;
    padding:6px 8px;
  }
  table.doc-table th{
    text-align:center;
  }
  .num-col{width:40px; text-align:center;}
  .unit-col{width:90px; text-align:center;}
  .qty-col{width:70px; text-align:center;}
  .price-col{width:110px; text-align:right;}
  .sum-col{width:120px; text-align:right; font-weight:bold;}
  .total-label{text-align:right; font-weight:bold;}
  .words-line{
    font-size:14px;
    margin:14px 0;
    padding-top:10px;
    border-top:1px solid #000;
  }
  .sign-block{
    display:flex;
    justify-content:space-between;
    margin-top:36px;
    font-size:14px;
  }
  .sign-block div{width:48%;}
  .sign-line{
    margin-top:26px;
    border-top:1px solid #000;
    width:80%;
  }

  .theme-switch{
    font-family: var(--ui-font);
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 18px;
    background:var(--ink);
  }
  .theme-switch label{font-size:12px; color:#cfc6b4;}
  .theme-switch select{
    font-family: var(--ui-font);
    font-size:13px;
    padding:5px 8px;
    border-radius:3px;
    border:1px solid #555;
    background:#2a251d;
    color:#fdf9ef;
  }

  /* ===== ТЕМА: гламурный леопард (розовый + золото) ===== */
  body.theme-leopard{
    background:
      radial-gradient(circle at 18% 25%, #6b3a24 0 9px, transparent 10px),
      radial-gradient(circle at 55% 12%, #5c3320 0 7px, transparent 8px),
      radial-gradient(circle at 82% 40%, #6b3a24 0 10px, transparent 11px),
      radial-gradient(circle at 32% 60%, #5c3320 0 8px, transparent 9px),
      radial-gradient(circle at 8% 78%, #6b3a24 0 9px, transparent 10px),
      radial-gradient(circle at 92% 82%, #5c3320 0 7px, transparent 8px),
      radial-gradient(circle at 60% 48%, #6b3a24 0 8px, transparent 9px),
      #dd8ba0;
    background-size: 130px 130px;
  }
  body.theme-leopard .toolbar{
    background: linear-gradient(135deg, #fdf1ea, #f7ddd0);
    border-top-color:#b8860b;
    border-bottom-color:#e3b8c4;
  }
  body.theme-leopard .toolbar .section{ border-top-color:#e6c9a8; }
  body.theme-leopard .toolbar h2{ color:#a15275; }
  body.theme-leopard .toolbar h2 .num{ color:#b8860b; }
  body.theme-leopard .field input, body.theme-leopard .field select{ border-bottom-color:#d9a441; color:#4a2e1a; }
  body.theme-leopard .btn{ background:#b8860b; border-color:#b8860b; color:#3a2405; }
  body.theme-leopard .btn:hover{ background:#96700a; border-color:#96700a; }
  body.theme-leopard .btn.secondary{ color:#a15275; border-color:#a15275; }
  body.theme-leopard .btn.secondary:hover{ background:#a15275; color:#fff; }
  body.theme-leopard .theme-switch{ background:#6b3a24; }
  body.theme-leopard .chip{ border-color:#d9a441; color:#7a4a2a; }
  body.theme-leopard .chip:hover{ border-color:#b8860b; color:#4a2e1a; }

  /* ===== ТЕМА: чёрная пантера (чёрный + серебро/бриллианты) ===== */
  body.theme-panther{
    background:#0a0a0a;
  }
  body.theme-panther .toolbar{
    background: linear-gradient(160deg,#161616,#050505);
    border-top-color:#d9d9de;
    border-bottom-color:#2a2a2e;
  }
  body.theme-panther .toolbar h2{ color:#e8e8ee; }
  body.theme-panther .toolbar h2 .num{ color:#c7c7d1; }
  body.theme-panther .toolbar .section{ border-top-color:#2a2a2e; }
  body.theme-panther .field label{ color:#9a9a9a; }
  body.theme-panther .field input, body.theme-panther .field select{
    background:transparent; border-bottom:1.5px solid #3a3a3e; color:#f0f0f4;
  }
  body.theme-panther .field input:focus{ border-bottom-color:#d9d9de; }
  body.theme-panther .btn{ background:#d9d9de; border-color:#d9d9de; color:#0a0a0a; }
  body.theme-panther .btn:hover{ background:#f5f5fa; border-color:#f5f5fa; }
  body.theme-panther .btn.secondary{ background:transparent; color:#e8e8ee; border-color:#e8e8ee; }
  body.theme-panther .btn.secondary:hover{ background:#e8e8ee; color:#0a0a0a; }
  body.theme-panther table.items th{ background:#1c1c1f; color:#eee; border-color:#333; }
  body.theme-panther table.items td{ border-color:#333; }
  body.theme-panther table.items input{ color:#eee; }
  body.theme-panther .theme-switch{ background:#000; }
  body.theme-panther .chip{ background:transparent; border-color:#3a3a3e; color:#d9d9de; }
  body.theme-panther .chip:hover{ border-color:#d9d9de; color:#fff; }
  body.theme-panther .doc{ background:#fff; } /* печатный акт всегда светлый и чистый */

  @media print{
    .toolbar, .actions{display:none !important;}
    body{padding:0;}
    .doc{border:none; padding:0;}
    body.theme-leopard, body.theme-panther{ background:#fff !important; }
  }

  /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (max-width:640px){
    .toolbar{ padding:16px 12px 20px; margin-bottom:18px; }
    .field{ flex:1 1 100%; }
    .field input, .field select{ font-size:16px; }
    .row{ gap:10px; }
    .theme-switch{ padding:8px 12px; flex-wrap:wrap; }
    .doc{ padding:14px 12px; max-width:100%; }
    .doc-title{ font-size:15px; }
    table.items, table.doc-table{ font-size:12px; }
    table.items th, table.items td,
    table.doc-table th, table.doc-table td{ padding:5px; }
    .unit-col{ width:64px; }
    .qty-col{ width:56px; }
    .price-col{ width:80px; }
    .sum-col{ width:90px; }
    .sign-block{ flex-direction:column; gap:28px; margin-top:28px; }
    .sign-block div{ width:100%; }
    .actions{ gap:8px; }
    .actions .btn{ flex:1 1 auto; }
    .btn{ font-size:13px; padding:10px 14px; }
  }
</style>
</head>
<body>

<div class="theme-switch">
  <label for="themeSelect">Тема:</label>
  <select id="themeSelect" onchange="setTheme(this.value)">
    <option value="default">Обычная</option>
    <option value="theme-leopard">🐆 Гламурный леопард</option>
    <option value="theme-panther">🐈‍⬛ Чёрная пантера</option>
  </select>
</div>

<div class="toolbar">

  <div class="section">
    <h2><span class="num">I.</span> Стороны и дата</h2>
    <div class="row">
      <div class="field">
        <label>№ акта (можно оставить пустым)</label>
        <input id="aktNum" type="text" placeholder="__">
      </div>
      <div class="field">
        <label>Дата</label>
        <input id="aktDate" type="date">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Исполнитель (ФИО, без "ИП" — допишется само)</label>
        <input id="executor" type="text" placeholder="Акматов Нускат" list="execList" autocomplete="off">
        <datalist id="execList"></datalist>
      </div>
    </div>
    <div class="row" id="execChips" style="gap:6px;"></div>

    <div class="row">
      <div class="field">
        <label>Заказчик</label>
        <input id="customerName" type="text" value="ОсОО СК Нурзаман Юг">
      </div>
      <div class="field">
        <label>ИНН заказчика</label>
        <input id="customerInn" type="text" value="02701201510021">
      </div>
      <div class="field">
        <label>Директор (заказчик)</label>
        <input id="customerDirector" type="text" value="Айткулов И.С.">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Ставка налога, %</label>
        <input id="taxRate" type="number" value="4" step="0.01">
      </div>
    </div>
  </div>

  <div class="section">
    <h2><span class="num">II.</span> Услуги</h2>
    <div class="table-scroll">
    <table class="items" id="itemsTable">
      <thead>
        <tr>
          <th style="width:26px;">№</th>
          <th>Услуга</th>
          <th style="width:90px;">Ед. изм.</th>
          <th style="width:70px;">Кол-во</th>
          <th style="width:110px;">Цена за ед.</th>
          <th style="width:30px;"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    </div>
    <div class="actions">
      <button class="btn secondary small" onclick="addRow()">+ Добавить строку</button>
    </div>
  </div>

  <div class="section">
    <h2><span class="num">III.</span> Печать</h2>
    <div class="actions">
      <button class="btn" onclick="renderDoc()">Сформировать акт</button>
      <button class="btn secondary" onclick="window.print()">Печать / Сохранить как PDF</button>
    </div>
  </div>

</div>

<div class="doc" id="docOutput"></div>

<script>
let rowCount = 0;

function addRow(service="Консультирование и продажи квартир", unit="услуга", qty=1, price=""){
  rowCount++;
  const tbody = document.getElementById("itemsBody");
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td style="text-align:center;">${rowCount}</td>
    <td><input type="text" class="f-service" value="${service}"></td>
    <td><input type="text" class="f-unit" value="${unit}"></td>
    <td><input type="number" class="f-qty" value="${qty}" step="0.01"></td>
    <td><input type="number" class="f-price" value="${price}" step="0.01"></td>
    <td class="row-actions"><button class="btn danger small" onclick="removeRow(this)">✕</button></td>
  `;
  tbody.appendChild(tr);
}
function removeRow(btn){
  btn.closest("tr").remove();
  renumberRows();
}
function renumberRows(){
  const rows = document.querySelectorAll("#itemsBody tr");
  rows.forEach((r,i)=>{ r.children[0].textContent = i+1; });
  rowCount = rows.length;
}

addRow(); // одна строка по умолчанию

// ===== число прописью (сомы) =====
const ones = ["", "один", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
const onesF = ["", "одна", "две", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
const teens = ["десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать"];
const tens = ["", "", "двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
const hundreds = ["", "сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];

function triadToWords(n, feminine){
  let words = [];
  const h = Math.floor(n/100);
  const rem = n%100;
  if(h) words.push(hundreds[h]);
  if(rem >= 10 && rem < 20){
    words.push(teens[rem-10]);
  } else {
    const t = Math.floor(rem/10);
    const o = rem%10;
    if(t) words.push(tens[t]);
    if(o) words.push(feminine ? onesF[o] : ones[o]);
  }
  return words;
}

function pluralForm(n, forms){
  const n100 = n % 100;
  const n10 = n % 10;
  if(n100 >= 11 && n100 <= 14) return forms[2];
  if(n10 === 1) return forms[0];
  if(n10 >= 2 && n10 <= 4) return forms[1];
  return forms[2];
}

function numberToWords(num){
  num = Math.round(num);
  if(num === 0) return "ноль сом";
  const millions = Math.floor(num / 1000000);
  const thousands = Math.floor((num % 1000000) / 1000);
  const rest = num % 1000;

  let parts = [];
  if(millions){
    parts.push(...triadToWords(millions, false));
    parts.push(pluralForm(millions, ["миллион","миллиона","миллионов"]));
  }
  if(thousands){
    parts.push(...triadToWords(thousands, true));
    parts.push(pluralForm(thousands, ["тысяча","тысячи","тысяч"]));
  }
  if(rest || parts.length === 0){
    parts.push(...triadToWords(rest, false));
  }
  let text = parts.filter(Boolean).join(" ");
  text = text.charAt(0).toUpperCase() + text.slice(1);
  const somWord = pluralForm(num, ["сом","сома","сом"]);
  return `${text} ${somWord}`;
}

function fmt(n){
  return Math.round(n).toLocaleString("ru-RU");
}

function renderDoc(){
  const aktNum = document.getElementById("aktNum").value.trim();
  const aktDate = document.getElementById("aktDate").value;
  const executorName = document.getElementById("executor").value.trim();
  const executor = executorName ? `ИП ${executorName}` : "";
  const customerName = document.getElementById("customerName").value.trim();
  const customerInn = document.getElementById("customerInn").value.trim();
  const customerDirector = document.getElementById("customerDirector").value.trim();
  const taxRate = parseFloat(document.getElementById("taxRate").value) || 0;

  const dateStr = aktDate ? new Date(aktDate).toLocaleDateString("ru-RU") : "____________";

  const rows = document.querySelectorAll("#itemsBody tr");
  let itemsHtml = "";
  let subtotal = 0;
  rows.forEach((r, i) => {
    const service = r.querySelector(".f-service").value;
    const unit = r.querySelector(".f-unit").value;
    const qty = parseFloat(r.querySelector(".f-qty").value) || 0;
    const price = parseFloat(r.querySelector(".f-price").value) || 0;
    const sum = qty * price;
    subtotal += sum;
    itemsHtml += `
      <tr>
        <td class="num-col">${i+1}</td>
        <td>${service}</td>
        <td class="unit-col">${unit}</td>
        <td class="qty-col">${qty}</td>
        <td class="price-col">${fmt(price)}</td>
        <td class="sum-col">${fmt(sum)}</td>
      </tr>`;
  });

  // Налог считается как % от ИТОГОВОЙ суммы (сумма услуг = сумма за вычетом налога),
  // а не как % от суммы услуг. Итого = Сумма / (1 - ставка).
  const rate = taxRate / 100;
  const total = rate < 1 ? subtotal / (1 - rate) : subtotal;
  const tax = total - subtotal;

  const doc = document.getElementById("docOutput");
  doc.innerHTML = `
    <div class="doc-title">Акт выполненных услуг № ${aktNum || "__"} от ${dateStr}</div>
    <div class="doc-meta">Исполнитель: ${executor || "____________________"}</div>
    <div class="doc-meta">Заказчик: ${customerName}, ИНН ${customerInn}</div>

    <div class="table-scroll">
    <table class="doc-table">
      <thead>
        <tr>
          <th class="num-col">№</th>
          <th>Услуга</th>
          <th class="unit-col">Ед. изм.</th>
          <th class="qty-col">Кол-во</th>
          <th class="price-col">Цена за ед.</th>
          <th class="sum-col">Сумма</th>
        </tr>
      </thead>
      <tbody>
        ${itemsHtml}
        <tr>
          <td colspan="5" class="total-label">Налог, ${taxRate}%</td>
          <td class="sum-col">${fmt(tax)}</td>
        </tr>
        <tr>
          <td colspan="5" class="total-label">Итого</td>
          <td class="sum-col">${fmt(total)}</td>
        </tr>
      </tbody>
    </table>
    </div>

    <div class="words-line">Всего оказано услуг на сумму: ${numberToWords(total)}</div>

    <div class="sign-block">
      <div>
        Исполнитель: ${executor || "____________________"}
        <div class="sign-line"></div>
      </div>
      <div>
        Заказчик: ${customerName}<br>директор ${customerDirector}
        <div class="sign-line"></div>
      </div>
    </div>
  `;
}

// ===== тема оформления (только для формы, печатный акт всегда чистый) =====
const LS_THEME = "akt_theme_v1";
function setTheme(theme){
  document.body.classList.remove("theme-leopard","theme-panther");
  if(theme === "theme-leopard" || theme === "theme-panther"){
    document.body.classList.add(theme);
  }
  try{ localStorage.setItem(LS_THEME, theme); }catch(e){}
}
(function loadTheme(){
  let theme = "default";
  try{ theme = localStorage.getItem(LS_THEME) || "default"; }catch(e){}
  document.getElementById("themeSelect").value = theme;
  setTheme(theme);
})();
const LS_CUSTOMER = "akt_customer_v1";
const LS_EXECUTORS = "akt_executors_v1";

function saveCustomerData(){
  const data = {
    customerName: document.getElementById("customerName").value.trim(),
    customerInn: document.getElementById("customerInn").value.trim(),
    customerDirector: document.getElementById("customerDirector").value.trim(),
    taxRate: document.getElementById("taxRate").value
  };
  try{ localStorage.setItem(LS_CUSTOMER, JSON.stringify(data)); }catch(e){}
}

function loadCustomerData(){
  try{
    const raw = localStorage.getItem(LS_CUSTOMER);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.customerName) document.getElementById("customerName").value = data.customerName;
    if(data.customerInn) document.getElementById("customerInn").value = data.customerInn;
    if(data.customerDirector) document.getElementById("customerDirector").value = data.customerDirector;
    if(data.taxRate) document.getElementById("taxRate").value = data.taxRate;
  }catch(e){}
}

function getExecutorsList(){
  try{
    const raw = localStorage.getItem(LS_EXECUTORS);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function saveExecutorsList(list){
  try{ localStorage.setItem(LS_EXECUTORS, JSON.stringify(list)); }catch(e){}
}

function addExecutorToList(name){
  if(!name) return;
  const list = getExecutorsList();
  if(!list.includes(name)){
    list.push(name);
    saveExecutorsList(list);
  }
  renderExecutorUI();
}

function removeExecutorFromList(name){
  let list = getExecutorsList();
  list = list.filter(n => n !== name);
  saveExecutorsList(list);
  renderExecutorUI();
}

function renderExecutorUI(){
  const list = getExecutorsList();
  // datalist для автодополнения при вводе
  const dl = document.getElementById("execList");
  dl.innerHTML = list.map(n => `<option value="${n}">`).join("");
  // чипы для быстрого выбора одним нажатием
  const chips = document.getElementById("execChips");
  chips.innerHTML = list.map(n =>
    `<span class="chip" onclick="selectExecutor('${n.replace(/'/g,"\\'")}')">${n}<span class="x" onclick="event.stopPropagation(); removeExecutorFromList('${n.replace(/'/g,"\\'")}')">✕</span></span>`
  ).join("");
}

function selectExecutor(name){
  document.getElementById("executor").value = name;
  renderDoc();
}

// подключаем автосохранение к существующим полям
["customerName","customerInn","customerDirector","taxRate"].forEach(id=>{
  document.getElementById(id).addEventListener("change", saveCustomerData);
});

const origRenderDoc = renderDoc;
renderDoc = function(){
  origRenderDoc();
  saveCustomerData();
  const execName = document.getElementById("executor").value.trim();
  if(execName){ addExecutorToList(execName); }
};

loadCustomerData();
renderExecutorUI();
renderDoc();

// дата по умолчанию — сегодня, но её можно поменять вручную
(function setDefaultDate(){
  const d = new Date();
  const iso = d.toISOString().slice(0,10);
  document.getElementById("aktDate").value = iso;
  renderDoc();
})();
</script>
